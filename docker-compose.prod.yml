# Prod overrides: no source bind-mounts, production Dockerfiles, nginx serves
# the built frontend, DB not exposed to the host.
#
# Two ways this gets used:
#   1. Build-and-run locally:
#        cp .env.example .env   # fill in real production values first
#        docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#   2. Deploy pre-built images (Aliyun ECS target -- see ALIYUN_DEPLOY.md and
#      scripts/deploy-aliyun.sh, run by hand from your own machine, never by
#      GitHub): the `image:` fields below let the exact same file also just
#      *pull* images that script already built and pushed to Alibaba Cloud
#      Container Registry, with no build context needed on disk (verified:
#      `docker compose pull`/`up` without `--build` never touch
#      `build.context`, only `docker compose build`/`up --build` do):
#        IMAGE_TAG=<git-sha> docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#        IMAGE_TAG=<git-sha> docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  db:
    # Pull mysql:8.0 from ACR instead of Docker Hub directly -- confirmed on
    # the real Aliyun ECS deploy target that Docker Hub connectivity times
    # out entirely (common for mainland-China-region VMs), while ACR pulls
    # work fine. scripts/deploy-aliyun.sh mirrors mysql:8.0 into the same ACR
    # namespace as the app images before every deploy (cheap/idempotent after
    # the first push -- ACR already has the layers). Harmless for a
    # non-Aliyun deploy target too: just don't set ACR_REGISTRY/ACR_NAMESPACE
    # and this falls back to the same defaults backend/frontend use below.
    image: ${ACR_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/${ACR_NAMESPACE:-shinshin}/mysql:8.0
    # !override: Compose merges list fields (volumes/ports) across -f files by
    # default instead of replacing them — !override forces a full replace so
    # the dev host-port mapping is actually dropped, not appended to.
    ports: !override []   # only reachable from other containers on the compose network
    # unless-stopped: come back on their own after the Docker daemon restarts
    # (dockerd itself is enabled on boot) or the VM reboots -- confirmed
    # necessary the hard way: a prod VM freeze needed a console-level hard
    # reboot to recover, and with no restart policy every container just sat
    # Exited afterward until someone SSHed in and ran `up -d` by hand. Dev
    # (docker-compose.yml) deliberately has no restart policy of its own --
    # a crash there should surface immediately, not loop silently.
    restart: unless-stopped
    # mem_limit: the target VM is a small 1.6GB instance with (until now) no
    # swap and no per-container caps -- a memory spike in any one service had
    # nowhere to go but to consume everything and lock up the whole host
    # (confirmed: two prod freezes that needed a hard console reboot, one
    # coinciding with a PDF upload -- pdfjs-dist-based extraction is far
    # heavier than the old docx/pptx path). A hard per-container ceiling
    # means the worst case is now that one container gets OOM-killed and
    # comes back via restart:unless-stopped above, not the whole VM hanging.
    # Sized against actual usage (db alone already runs ~400-450MB) with
    # headroom, leaving enough of the VM's 1.6GB + the swapfile added
    # alongside this for the host OS and Docker itself.
    mem_limit: 700m

  backend:
    image: ${ACR_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/${ACR_NAMESPACE:-shinshin}/shinshin-curriculum-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes: !override
      - backend_upload:/app/upload   # keep upload persistence; drop the dev source bind-mount
    command: node server.js
    restart: unless-stopped
    # See db's mem_limit comment -- this is the service actually implicated
    # in the two prod freezes (PDF/doc text extraction). Normal baseline is
    # ~100-150MB; 512MB gives real headroom for extracting a large PDF while
    # still guaranteeing a runaway one gets killed+restarted rather than
    # taking the VM down.
    mem_limit: 512m

  frontend:
    image: ${ACR_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/${ACR_NAMESPACE:-shinshin}/shinshin-curriculum-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./react-app
      dockerfile: Dockerfile
    ports: !override
      - "80:80"
    volumes: !override []   # static build is baked into the image; nothing to mount
    depends_on:
      - backend
    restart: unless-stopped
    # nginx serving a static build -- baseline usage is a few MB; generous
    # ceiling purely as a backstop, see db's mem_limit comment.
    mem_limit: 128m
