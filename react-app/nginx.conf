server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend container (service name "backend"
    # in docker-compose.yml). http-common.js uses a relative "/api" base URL,
    # so this works identically to the CRA dev-server proxy in setupProxy.js.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 25m was rejecting real uploads outright with a raw (non-JSON) 413 --
        # confirmed on the live deploy target, repeatedly, against 课时-level
        # 视频/图片 artifacts. Multer itself imposes no size limit on this
        # endpoint (artifact.controller.js's uploadFields), and the bulk-zip
        # endpoint already defaults to allowing up to 1GB
        # (BULK_MAX_ZIP_BYTES) -- 25m was inconsistent with the rest of the
        # app's own intended capacity, not a deliberate cap.
        client_max_body_size 1024m;
        # nginx's 60s default proxy timeouts would just trade the 413 above for
        # a 504 on a large video over a slow connection once the size cap is no
        # longer the bottleneck -- generous enough for a slow upload of a
        # large file, not just a slow API call.
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # SPA fallback: let react-router handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
