name: Deploy to ECS

# Auto-deploys on every push to main -- see ALIYUN_DEPLOY.md §10. Originally
# manual-only, because sequelize.sync() never altered existing tables, so a
# schema-changing commit needed its migration run by hand before the new
# code went live. That gap is closed: backend/docker-entrypoint.sh now runs
# `sequelize-cli db:migrate` automatically on every backend container start,
# so a migration committed alongside the code just applies itself the moment
# this workflow restarts the container -- no manual step in between anymore.
# workflow_dispatch stays available for a manual re-run (e.g. a rollback to
# an older tag).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to build+deploy (default: this run's commit short SHA)"
        required: false
        default: ""
      keep_versions:
        description: "Old image builds to keep per repo on the ECS VM after this deploy"
        required: false
        default: "3"

jobs:
  deploy:
    # Pinned rather than ubuntu-latest, which migrates to Ubuntu 26 from
    # 2026-10-19 -- move this forward deliberately, not on GitHub's schedule.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up ECS SSH access
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/ecs_deploy_key
          chmod 600 ~/.ssh/ecs_deploy_key
          ssh-keyscan -H "${{ secrets.ECS_HOST }}" >> ~/.ssh/known_hosts

      # Buildx + the GitHub Actions cache backend, so unchanged image layers
      # aren't re-uploaded to ACR on every run -- see build_and_push in
      # scripts/deploy-aliyun.sh. ghaction-github-runtime exposes the
      # cache service's URL/token to the script's own buildx calls.
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build, push, and deploy
        env:
          BUILDX_GHA_CACHE: "true"
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY_PATH: /home/runner/.ssh/ecs_deploy_key
          ECS_DEPLOY_PATH: ${{ secrets.ECS_DEPLOY_PATH }}
          KEEP_IMAGE_VERSIONS: ${{ github.event.inputs.keep_versions }}
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            ./scripts/deploy-aliyun.sh "${{ github.event.inputs.image_tag }}"
          else
            ./scripts/deploy-aliyun.sh
          fi
